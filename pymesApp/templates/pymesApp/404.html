<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada · Sistema de Inventario para PYMEs</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1b3a57 0%, #24506f 100%);
            color: #eef2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .codigo {
            font-size: 90px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 4px;
            color: #ffffff;
        }
        .linea {
            width: 60px;
            height: 4px;
            background: #7fa8c9;
            margin: 14px auto 20px;
            border-radius: 2px;
        }
        h2 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #c3d3e0;
            max-width: 380px;
            line-height: 1.5;
        }
        a {
            color: #1b3a57;
            background: #ffffff;
            padding: 11px 26px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-top: 22px;
            display: inline-block;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.85; }
        .marca {
            position: absolute;
            top: 24px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #7fa8c9;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="marca">Sistema de Inventario para PYMEs</div>
    <p class="codigo">404</p>
    <div class="linea"></div>
    <h2>Página no encontrada</h2>
    <p>La ruta que intentaste acceder no existe dentro del sistema. Verifica la dirección o vuelve al inicio.</p>
    <a href="/">Volver al inicio</a>
</body>
</html>
