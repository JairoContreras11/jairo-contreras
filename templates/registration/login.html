<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Seguro | Sistema de Inventario PYME</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-mono uppercase tracking-wider mb-4">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
        Control de Acceso
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Inventario Central PYME</h1>
      <p class="text-xs text-slate-400 mt-2">Ingresa tus credenciales corporativas para acceder a la plataforma</p>
    </div>

    {% if form.errors %}
      <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-3">
        <span>Usuario o contraseña incorrectos. Revisa e intenta nuevamente.</span>
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-5">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nombre de Usuario</label>
        <input type="text" name="username" required autofocus class="w-full px-4 py-2.5 rounded-lg bg-slate-950/60 border border-slate-700/80 text-white focus:outline-none focus:border-indigo-500 text-sm transition-all">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Contraseña</label>
        <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg bg-slate-950/60 border border-slate-700/80 text-white focus:outline-none focus:border-indigo-500 text-sm transition-all">
      </div>
      <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold text-white text-sm shadow-lg shadow-indigo-600/20 transition-all">
        Ingresar al Portal
      </button>
    </form>

    <div class="mt-6 text-center border-t border-slate-800/80 pt-4">
      <a href="{% url 'bienvenida' %}" class="text-xs text-slate-400 hover:text-indigo-400 transition-colors">
        &larr; Volver a la portada pública
      </a>
    </div>
  </div>
</body>
</html>
